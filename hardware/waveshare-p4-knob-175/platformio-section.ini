[env:waveshare_p4_knob]
; Waveshare ESP32-P4-Knob-Touch-AMOLED-1.75: ESP32-P4 v3.x, 32 MB flash, 32 MB
; PSRAM, MIPI-DSI CO5300, CST9217, knob, ES8389 and a classic ESP32 radio chip on
; SDIO. Arduino 3.3.12 as an ESP-IDF 5.5.5 component (the radio chip type and
; BLE host are compile-time IDF choices). Build it with its own
; PLATFORMIO_CORE_DIR: the 3.3.12 platform replaces 3.0.7's framework packages.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-p4_r3
framework = arduino, espidf
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_psram = 200000000L
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = hardware/waveshare-p4-knob-175/partitions.csv
board_build.esp-idf.sdkconfig_path = ${platformio.workspace_dir}/sdkconfig.waveshare_p4_knob
extra_scripts =
    ${env.extra_scripts}
    post:tools/p4_image_revisions.py
board_build.cmake_extra_args = -DDRAGON_BOARD=waveshare_p4_knob
; Unflag only the USB mode: an unflag also strips the same flag from build_flags.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Ifirmware/include
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_WAVESHARE_P4_KNOB
    -DDRAGON_WIFI_CLOCK
lib_ignore = ESP8266Audio, NimBLE-Arduino, ESP32_Display_Panel, ESP32_IO_Expander, esp_lcd_co5300, es8311
lib_deps =
    lewisxhe/SensorLib@0.3.1
    lewisxhe/XPowersLib@0.2.6
